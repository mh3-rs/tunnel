[package]
name = "tunnel"
description = "The quest bots' tunnel: what the mh3sp server (the bots' body) and mh3sp-brain (their brain) say to each other."
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
