# `cargo deny check` (scripts/ci-tests.sh): known vulnerabilities, licenses compatible with AGPL-3.0, sources.
[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
# Permissive licenses the dependencies use today, all compatible with AGPL-3.0-or-later. A new one is a decision.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[licenses.private]
# Our own crate, published only to our registry (.cargo/config.toml).
ignore = true
registries = ["gitea"]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
